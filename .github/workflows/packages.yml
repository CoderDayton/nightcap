name: Nightly

on:
  schedule:
    # 05:00 UTC daily. A run whose commit already carries the continuous tag
    # exits without rebuilding, so a quiet day costs one probe job.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-appimage
  cancel-in-progress: false

jobs:
  probe:
    name: Check for new commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      previous: ${{ steps.decide.outputs.previous }}
    steps:
      - name: Compare HEAD against the published continuous tag
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/continuous" \
            --jq .object.sha 2>/dev/null || true)"
          echo "previous=$published" >>"$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$published" == "$GITHUB_SHA" ]]; then
            echo 'build=false' >>"$GITHUB_OUTPUT"
            echo "continuous already points at $GITHUB_SHA; nothing to build"
          else
            echo 'build=true' >>"$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: probe
    if: needs.probe.outputs.build == 'true'
    uses: ./.github/workflows/build-packages.yml
    with:
      channel: nightly

  publish:
    name: Publish continuous release
    needs: [probe, build]
    # A manual run from another branch still builds and smoke-tests, but the
    # continuous tag and release only ever follow main.
    if: needs.probe.outputs.build == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'Nightcap-*'
          merge-multiple: true
          path: release

      - name: Name and checksum the nightly build
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          # The .zsync file names the AppImage it updates, so the build already
          # carries the published name.
          test -s release/Nightcap-nightly-x86_64.AppImage
          test -s release/Nightcap-nightly-x86_64.AppImage.zsync
          rename_one() {
            local glob="$1" name="$2" matched
            matched=(release/$glob)
            if [[ ${#matched[@]} -ne 1 ]]; then
              echo "::error::expected one ${glob} package, found ${#matched[@]}"
              exit 1
            fi
            mv -- "${matched[0]}" "release/$name"
          }
          rename_one '*.deb' nightcap-nightly_amd64.deb
          rename_one '*.rpm' nightcap-nightly-x86_64.rpm
          rename_one '*.pkg.tar.zst' nightcap-nightly-x86_64.pkg.tar.zst
          (
            cd release
            for asset in Nightcap-nightly-x86_64.AppImage nightcap-nightly_amd64.deb \
                nightcap-nightly-x86_64.rpm nightcap-nightly-x86_64.pkg.tar.zst; do
              sha256sum "$asset" > "$asset.sha256"
            done
          )
          find release -maxdepth 1 -type f -print

      - name: Write release notes
        shell: bash
        env:
          PREVIOUS: ${{ needs.probe.outputs.previous }}
        run: |
          set -Eeuo pipefail
          {
            printf 'Automated build of `main` at `%s` (%s).\n\n' \
              "${GITHUB_SHA:0:8}" "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'Untested and unreleased. Use a [tagged release](https://github.com/%s/releases/latest) for normal play.\n\n' \
              "$GITHUB_REPOSITORY"
            printf 'Packages are versioned `%s`.\n' "$(./scripts/package_version.sh --nightly)"
            if [[ -n "$PREVIOUS" ]] &&
                git merge-base --is-ancestor "$PREVIOUS" "$GITHUB_SHA" 2>/dev/null; then
              commits="$(git log --no-merges --max-count=50 --format='- %s (`%h`)' "$PREVIOUS..$GITHUB_SHA")"
              if [[ -n "$commits" ]]; then
                printf '\n### Commits since the previous nightly\n\n%s\n' "$commits"
              fi
            fi
            if unreleased="$(./scripts/release_notes.sh Unreleased 2>/dev/null)"; then
              printf '\n### Unreleased changelog\n\n%s\n' \
                "$(printf '%s\n' "$unreleased" | sed 's/^### /#### /')"
            fi
          } > notes.md
          cat notes.md

      - name: Update continuous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force continuous "$GITHUB_SHA"
          git push origin refs/tags/continuous --force
          if ! gh release view continuous >/dev/null 2>&1; then
            gh release create continuous \
              --prerelease \
              --title "Nightcap continuous" \
              --notes-file notes.md
          fi
          gh release edit continuous --title "Nightcap continuous" --notes-file notes.md
          gh release upload continuous release/* --clobber
          # Drop assets left by earlier runs under other names.
          published=" $(cd release && printf '%s ' *) "
          while IFS= read -r asset; do
            if [[ "$published" != *" $asset "* ]]; then
              gh release delete-asset continuous "$asset" --yes
            fi
          done < <(gh release view continuous --json assets --jq '.assets[].name')
