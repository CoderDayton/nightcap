name: Check AUR packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur-packages
  cancel-in-progress: true

jobs:
  metadata:
    name: Refresh AUR metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare AUR metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          package_dir="$GITHUB_WORKSPACE/packaging/aur/nightcap-git"
          version="$(git describe --tags --abbrev=0 --match='v[0-9]*')"
          version="${version#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          pkgver="${version}.r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" "$package_dir/PKGBUILD"

          docker run --rm \
            --volume "$package_dir:/pkg" \
            archlinux:base-devel bash -Eeuo pipefail -c '
              useradd --create-home builder
              install -d -o builder -g builder /tmp/nightcap-git
              install -o builder -g builder -m 0644 \
                /pkg/PKGBUILD /tmp/nightcap-git/PKGBUILD
              runuser -u builder -- bash -c \
                "cd /tmp/nightcap-git && makepkg --printsrcinfo" \
                > /pkg/.SRCINFO
            '

          grep -Fqx "pkgver=${pkgver}" "$package_dir/PKGBUILD"
          grep -Fqx $'\tpkgver = '"${pkgver}" "$package_dir/.SRCINFO"

      - name: Upload AUR metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Nightcap-AUR
          path: packaging/aur/nightcap-git/.SRCINFO
          if-no-files-found: error
          retention-days: 14
