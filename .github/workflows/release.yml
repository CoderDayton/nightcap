name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-packages.yml
    with:
      channel: release

  # Also publishes the stable Flatpak repository to Pages, so only tags run it.
  flatpak:
    name: Flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/flatpak.yml
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    secrets: inherit

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 'Nightcap-*'
          merge-multiple: true
          path: release

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          tag="${GITHUB_REF_NAME}"
          # An unmatched glob would otherwise reach sha256sum and gh as its own
          # literal text, so every package pattern has to match before upload.
          shopt -s nullglob
          test -s release/Nightcap-x86_64.AppImage
          test -s release/Nightcap-x86_64.flatpak
          assets=(Nightcap-x86_64.AppImage Nightcap-x86_64.flatpak)
          for glob in '*.deb' '*.rpm' '*.pkg.tar.zst'; do
            matched=(release/$glob)
            if [[ ${#matched[@]} -eq 0 ]]; then
              echo "::error::no ${glob} package among the release artifacts"
              exit 1
            fi
            assets+=("${matched[@]#release/}")
          done
          uploads=()
          for asset in "${assets[@]}"; do
            uploads+=("release/$asset" "release/$asset.sha256")
          done
          (
            cd release
            for asset in "${assets[@]}"; do
              sha256sum "$asset" > "$asset.sha256"
            done
          )
          ./scripts/release_notes.sh "$tag" > release/notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Nightcap $tag" --notes-file release/notes.md ||
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "Nightcap $tag" --notes-file release/notes.md
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "${uploads[@]}"

  # nightcap-bin downloads the pacman package from the release page, so this
  # waits for the upload.
  aur:
    name: Publish AUR packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
